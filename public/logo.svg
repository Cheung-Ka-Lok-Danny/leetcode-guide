<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA116;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" opacity="0.1"/>
  <!-- 代码括号 { -->
  <text x="62" y="135" font-family="monospace" font-weight="900" font-size="100" fill="#FFA116" opacity="0.25">&#123;</text>
  <!-- L 字母 -->
  <text x="68" y="128" font-family="Arial" font-weight="bold" font-size="72" fill="#FFA116">L</text>
  <!-- 代码括号 } -->
  <text x="118" y="135" font-family="monospace" font-weight="900" font-size="100" fill="#FFA116" opacity="0.25">&#125;</text>
  <!-- 下划线 -->
  <line x1="55" y1="140" x2="145" y2="140" stroke="#FFA116" stroke-width="3" stroke-linecap="round"/>
  <!-- 装饰点 -->
  <circle cx="45" cy="45" r="4" fill="#FFA116" opacity="0.5"/>
  <circle cx="155" cy="45" r="4" fill="#FFA116" opacity="0.5"/>
  <circle cx="45" cy="155" r="4" fill="#FFA116" opacity="0.5"/>
  <circle cx="155" cy="155" r="4" fill="#FFA116" opacity="0.5"/>
</svg>
